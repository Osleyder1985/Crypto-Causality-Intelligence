<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
<title id="title">Cinco fases de Crypto-Causality Intelligence</title>
<desc id="desc">Cinco etapas: Historical Market Intelligence, Causality Research Methodology, Market Regime Intelligence, Predictive Intelligence y Autonomous Market Intelligence.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061326"/><stop offset="1" stop-color="#020814"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0ea5e9"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
 <style>
 .head{font:700 36px Inter,Segoe UI,sans-serif;fill:#f8fafc}.num{font:700 25px Inter,Segoe UI,sans-serif;fill:#fff}
 .title{font:700 21px Inter,Segoe UI,sans-serif;fill:#f8fafc}.body{font:400 16px Inter,Segoe UI,sans-serif;fill:#cbd5e1}
 .tag{font:700 14px Inter,Segoe UI,sans-serif;fill:#bae6fd;letter-spacing:1px}
 </style>
</defs>
<rect width="1440" height="600" rx="26" fill="url(#bg)"/>
<text x="70" y="78" class="tag">HOJA DE RUTA / EVOLUCIÓN METODOLÓGICA</text>
<text x="70" y="130" class="head">Cinco fases hacia la inteligencia predictiva</text>
<path d="M140 270H1300" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
<g transform="translate(48 190)">
 <rect width="250" height="300" rx="18" fill="#0b1b31" stroke="#0ea5e9" stroke-width="2"/>
 <circle cx="42" cy="44" r="25" fill="#0284c7"/><text x="42" y="53" text-anchor="middle" class="num">1</text>
 <text x="28" y="105" class="title">Historical Market</text><text x="28" y="132" class="title">Intelligence</text>
 <text x="28" y="190" class="body">Investigar episodios</text><text x="28" y="216" class="body">históricos y reconstruir</text><text x="28" y="242" class="body">sus posibles impulsores.</text>
 <text x="28" y="278" class="tag">BASE DE CONOCIMIENTO</text>
</g>
<g transform="translate(336 190)">
 <rect width="250" height="300" rx="18" fill="#0b1b31" stroke="#10b981" stroke-width="2"/>
 <circle cx="42" cy="44" r="25" fill="#059669"/><text x="42" y="53" text-anchor="middle" class="num">2</text>
 <text x="28" y="105" class="title">Causality Research</text><text x="28" y="132" class="title">Methodology</text>
 <text x="28" y="190" class="body">Formular y contrastar</text><text x="28" y="216" class="body">hipótesis con evidencias,</text><text x="28" y="242" class="body">alternativas y refutación.</text>
 <text x="28" y="278" class="tag">MÉTODO CIENTÍFICO</text>
</g>
<g transform="translate(624 190)">
 <rect width="250" height="300" rx="18" fill="#11152e" stroke="#8b5cf6" stroke-width="2"/>
 <circle cx="42" cy="44" r="25" fill="#7c3aed"/><text x="42" y="53" text-anchor="middle" class="num">3</text>
 <text x="28" y="105" class="title">Market Regime</text><text x="28" y="132" class="title">Intelligence</text>
 <text x="28" y="190" class="body">Detectar regímenes</text><text x="28" y="216" class="body">alcistas, bajistas y</text><text x="28" y="242" class="body">laterales y transiciones.</text>
 <text x="28" y="278" class="tag">COMPRENSIÓN DEL MERCADO</text>
</g>
<g transform="translate(912 190)">
 <rect width="250" height="300" rx="18" fill="#211b17" stroke="#f59e0b" stroke-width="2"/>
 <circle cx="42" cy="44" r="25" fill="#d97706"/><text x="42" y="53" text-anchor="middle" class="num">4</text>
 <text x="28" y="105" class="title">Predictive</text><text x="28" y="132" class="title">Intelligence</text>
 <text x="28" y="190" class="body">Evaluar escenarios</text><text x="28" y="216" class="body">futuros con validación</text><text x="28" y="242" class="body">fuera de muestra.</text>
 <text x="28" y="278" class="tag">PREDICCIÓN EVALUABLE</text>
</g>
<g transform="translate(1200 190)">
 <rect width="200" height="300" rx="18" fill="#062723" stroke="#14b8a6" stroke-width="2"/>
 <circle cx="42" cy="44" r="25" fill="#0f766e"/><text x="42" y="53" text-anchor="middle" class="num">5</text>
 <text x="25" y="105" class="title">Autonomous</text><text x="25" y="132" class="title">Market</text><text x="25" y="159" class="title">Intelligence</text>
 <text x="25" y="205" class="body">Monitorear, alertar</text><text x="25" y="231" class="body">y recomendar.</text>
 <text x="25" y="278" class="tag">SUPERVISIÓN HUMANA</text>
</g>
<text x="720" y="550" text-anchor="middle" font="600 15px Inter,Segoe UI,sans-serif" fill="#94a3b8">Las fases avanzan según criterios de aceptación verificables, no por calendario.</text>
</svg>
