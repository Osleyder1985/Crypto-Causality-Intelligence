name: BTCUSDT Spot vs USD-M aggTrades

on:
  workflow_dispatch:
    inputs:
      date:
        description: UTC date YYYY-MM-DD
        required: true
        default: "2026-10-06"
  pull_request:
    paths:
      - ".github/workflows/btcusdt-aggtrades-acquisition.yml"
      - "scripts/research/download_binance_btcusdt_aggtrades.py"
      - "tests/test_binance_aggtrades_downloader.py"

permissions:
  contents: read

jobs:
  unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_binance_aggtrades_downloader.py

  acquire:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Acquire both Binance daily aggTrades archives
        run: |
          python scripts/research/download_binance_btcusdt_aggtrades.py \
            --date "${{ inputs.date }}" \
            --output artifacts/btcusdt_aggtrades
      - name: Retain raw ZIPs, checksums, events and signed flow series
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-aggtrades-${{ inputs.date }}-${{ github.run_id }}
          path: artifacts/btcusdt_aggtrades/
          if-no-files-found: warn
          retention-days: 90
