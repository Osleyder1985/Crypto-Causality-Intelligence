name: BTCUSDT Open Interest unit tests

on:
  push:
    branches:
      - feat/btcusdt-open-interest-coverage
    paths:
      - "scripts/research/fetch_btcusdt_open_interest_history.py"
      - "tests/test_btcusdt_open_interest_history.py"
      - ".github/workflows/open-interest-unit-tests.yml"
  pull_request:
    paths:
      - "scripts/research/fetch_btcusdt_open_interest_history.py"
      - "tests/test_btcusdt_open_interest_history.py"
      - ".github/workflows/open-interest-unit-tests.yml"

permissions:
  contents: read

jobs:
  test-open-interest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
