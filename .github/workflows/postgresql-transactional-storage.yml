name: PostgreSQL transactional storage

on:
  pull_request:
    paths:
      - "migrations/**"
      - "scripts/persistence/**"
      - "tests/test_transactional_market_writer.py"
      - ".github/workflows/postgresql-transactional-storage.yml"
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "scripts/persistence/**"
      - "tests/test_transactional_market_writer.py"
      - ".github/workflows/postgresql-transactional-storage.yml"

permissions:
  contents: read

jobs:
  transactional-storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Create CI application roles
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cci_test
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as conn:
              conn.execute("CREATE ROLE cci_app LOGIN PASSWORD 'ci-app-password'")
              conn.execute("CREATE ROLE cci_retention LOGIN PASSWORD 'ci-retention-password'")
          PY
      - name: Apply production migrations to empty PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cci_test
        run: python scripts/persistence/apply_migrations.py
      - name: Run transactional writer, retention and role integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cci_test
          APP_DATABASE_URL: postgresql://cci_app:ci-app-password@localhost:5432/cci_test
          RETENTION_DATABASE_URL: postgresql://cci_retention:ci-retention-password@localhost:5432/cci_test
        run: python -m unittest discover -s tests -p "test_transactional_market_writer.py" -v
