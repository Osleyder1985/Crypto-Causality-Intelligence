name: BTCUSDT Open Interest incremental evaluation

on:
  push:
    branches:
      - feat/btcusdt-open-interest-incremental-evaluation
    paths:
      - ".github/workflows/btcusdt-open-interest-incremental.yml"
      - "scripts/research/evaluate_btcusdt_open_interest_incremental.py"
      - "tests/test_btcusdt_open_interest_incremental.py"
  pull_request:
    paths:
      - ".github/workflows/btcusdt-open-interest-incremental.yml"
      - "scripts/research/evaluate_btcusdt_open_interest_incremental.py"
      - "tests/test_btcusdt_open_interest_incremental.py"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Open Interest history audit run ID
        required: true
        default: "42339253337"

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

  evaluate:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download verified Spot + Open Interest dataset
        uses: actions/download-artifact@v4
        with:
          name: btcusdt-usdm-open-interest-audit-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/source
      - name: Run paired walk-forward evaluation
        run: |
          mkdir -p artifacts/research
          python -m scripts.research.evaluate_btcusdt_open_interest_incremental \
            --input artifacts/source/btcusdt_spot_with_open_interest.jsonl \
            --output artifacts/research/btcusdt_open_interest_incremental_report.json \
            --min-train 168 \
            --ridge-alpha 0.000001 \
            --bootstrap-repetitions 1000 \
            --seed 20261106
      - name: Preserve evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-open-interest-incremental-evaluation-${{ github.run_id }}
          path: artifacts/research/
          if-no-files-found: error
          retention-days: 90
