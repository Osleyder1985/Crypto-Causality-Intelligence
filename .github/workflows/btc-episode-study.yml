name: Pruebas del estudio de episodios BTC

on:
  push:
    branches:
      - research/issue-17-btc-episode-study
      - research/issue-18-duckdb-parquet
      - research/issue-19-postgresql-run-registry
    paths:
      - "scripts/research/**"
      - "tests/test_btc_episode_study.py"
      - "tests/test_episode_manifest.py"
      - ".github/workflows/btc-episode-study.yml"
      - "requirements-research.txt"
      - "migrations/postgresql/**"
      - "tests/postgresql/**"
      - "scripts/research/postgres_run_registry.py"
  pull_request:
    paths:
      - "scripts/research/**"
      - "tests/test_btc_episode_study.py"
      - "tests/test_episode_manifest.py"
      - ".github/workflows/btc-episode-study.yml"
      - "requirements-research.txt"
      - "migrations/postgresql/**"
      - "tests/postgresql/**"
      - "scripts/research/postgres_run_registry.py"
      - "docs/architecture/postgresql-*.md"
      - "docs/research/**"

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencia analítica fijada
        run: python -m pip install -r requirements-research.txt
      - name: Ejecutar pruebas con datos sintéticos y sin acceso a proveedores
        run: |
          python -m unittest discover -s tests -p 'test_btc_episode_study.py' -v
          python -m unittest discover -s tests -p 'test_episode_manifest.py' -v

  postgres-run-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cci
          POSTGRES_PASSWORD: cci_test_password
          POSTGRES_DB: cci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cci -d cci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CCI_TEST_DATABASE_URL: postgresql://cci:cci_test_password@localhost:5432/cci_test
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements-research.txt
      - name: Ejecutar pruebas de integración en PostgreSQL 16
        run: python -m unittest discover -s tests/postgresql -p 'test_research_run_registry.py' -v
