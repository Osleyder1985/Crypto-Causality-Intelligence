name: Research data validation

on:
  pull_request:
    paths:
      - "scripts/research/**"
      - "scripts/validation/**"
      - "requirements-validation.txt"
      - "tests/**"
      - ".github/workflows/research-data-validation.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/research/**"
      - "scripts/validation/**"
      - "requirements-validation.txt"
      - "tests/**"
      - ".github/workflows/research-data-validation.yml"

permissions:
  contents: read

jobs:
  binance-coverage-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
